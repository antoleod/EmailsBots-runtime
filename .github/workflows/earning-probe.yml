name: Earning opportunity probe

on:
  push:
    branches:
      - earn-probe-20260905

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe marketplaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.parse, json, re
          base='https://clawlancer.ai/api/listings'
          variants=[
            {'listing_type':'BOUNTY'},
            {'listing_type':'BOUNTY','limit':'200'},
            {'listing_type':'BOUNTY','per_page':'200'},
            {'listing_type':'BOUNTY','page':'2'},
            {'listing_type':'BOUNTY','offset':'50'},
            {'listing_type':'BOUNTY','sort':'price_desc'},
          ]
          for q in variants:
              url=base+'?'+urllib.parse.urlencode(q)
              try:
                  with urllib.request.urlopen(url,timeout=20) as r: data=json.load(r)
                  items=data.get('listings',[]) if isinstance(data,dict) else data
                  vals=[]
                  for x in items or []:
                      if isinstance(x,dict): vals.append((x.get('price_wei') or 0,x.get('id'),x.get('title'),x.get('status')))
                  vals=sorted(vals, reverse=True)
                  print('VAR',q,'COUNT',len(items or []),'MAX',vals[:10])
                  if isinstance(data,dict): print('META',q,{k:v for k,v in data.items() if k!='listings'})
              except Exception as e: print('ERR',q,repr(e))
          # Public docs / machine-readable specs
          for url in ['https://clawlancer.ai/openapi.json','https://clawlancer.ai/api/openapi.json','https://clawlancer.ai/docs','https://clawlancer.ai/api-docs','https://clawlancer.ai/robots.txt','https://clawlancer.ai/sitemap.xml']:
              try:
                  with urllib.request.urlopen(url,timeout=20) as r:
                      raw=r.read(200000).decode('utf-8','replace')
                  print('DOCURL',url,'STATUS','ok','LEN',len(raw),'HEAD',re.sub(r'\s+',' ',raw[:1000]))
              except Exception as e: print('DOCERR',url,repr(e))
          PY
