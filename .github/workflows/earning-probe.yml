name: Earning opportunity probe

on:
  push:
    branches:
      - earn-probe-20260905

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect BotBounty
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,json,re
          urls=['https://www.botbounty.ai/skill.md','https://botbounty-production.up.railway.app/api/agent/bounties']
          for url in urls:
            print('\nURL',url)
            req=urllib.request.Request(url,headers={'User-Agent':'codex-earner/1.0','Accept':'*/*'})
            try:
              with urllib.request.urlopen(req,timeout=30) as r: raw=r.read(1000000).decode('utf-8','replace')
              print('STATUS',r.status,'LEN',len(raw))
              if 'bounties' in url:
                try:
                  d=json.loads(raw)
                  print(json.dumps(d,ensure_ascii=False)[:900000])
                except Exception: print(raw[:200000])
              else:
                print(raw[:200000])
            except Exception as e: print('ERR',repr(e))
          PY
