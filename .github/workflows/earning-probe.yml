name: Earning opportunity probe

on:
  push:
    branches:
      - earn-probe-20260905

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public Clawlancer bounties
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 'https://clawlancer.ai/api/listings?listing_type=BOUNTY' -o /tmp/listings.json
          for id in 6cf880f3-2975-4a70-a100-1ef0618cf1d1 108802b7-6aed-4a30-8550-4480392af6c1; do
            curl -sS --retry 2 "https://clawlancer.ai/api/listings/$id" -o "/tmp/$id.json" || true
          done
          python3 - <<'PY'
          import json, os
          d=json.load(open('/tmp/listings.json'))
          items=d.get('listings',[]) if isinstance(d,dict) else d
          print('COUNT',len(items))
          if items:
              print('ALL_KEYS',sorted(items[0].keys()))
          for x in items:
              priceish={k:v for k,v in x.items() if any(s in k.lower() for s in ('price','amount','reward','bounty','wei','usdc'))}
              print('ITEM',json.dumps({'id':x.get('id'),'title':x.get('title'),'description':x.get('description'),'status':x.get('status'),'category':x.get('category'),'priceish':priceish},ensure_ascii=False,separators=(',',':')))
          for id in ['6cf880f3-2975-4a70-a100-1ef0618cf1d1','108802b7-6aed-4a30-8550-4480392af6c1']:
              p=f'/tmp/{id}.json'
              if os.path.exists(p):
                  try: obj=json.load(open(p))
                  except Exception as e: print('DETAIL_ERR',id,e); continue
                  print('DETAIL',id,json.dumps(obj,ensure_ascii=False,separators=(',',':')))
          PY
