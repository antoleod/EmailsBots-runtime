name: Earning opportunity probe

on:
  push:
    branches:
      - earn-probe-20260905

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Attempt useful fork for paid content bounty
        shell: bash
        run: |
          set +e
          gh api --method POST /repos/thesysdev/openui-creator-program/forks > /tmp/out.json 2>/tmp/err.txt
          code=$?
          echo "EXIT=$code"
          cat /tmp/out.json || true
          cat /tmp/err.txt || true
          exit 0
