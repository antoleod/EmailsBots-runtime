name: Earning opportunity probe

on:
  push:
    branches:
      - earn-probe-20260905

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Passive header check for in-scope TextJam clickjacking bounty
        shell: bash
        run: |
          set -euo pipefail
          for url in 'https://textjam.com/' 'https://textjam.com/login'; do
            echo "===== $url ====="
            curl -sS --max-time 20 -o /dev/null -D - "$url" | tr -d '\r'
          done
